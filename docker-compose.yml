services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autocall
      POSTGRES_USER: autocall
      POSTGRES_PASSWORD: autocall
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autocall -d autocall']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - autocall-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - autocall-network

  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command:
      [
        'sh',
        '-c',
        'export PATH="/workspace/apps/backend/node_modules/.bin:$$PATH"; prisma migrate deploy && prisma db seed',
      ]
    environment:
      DATABASE_URL: postgresql://autocall:autocall@postgres:5432/autocall?schema=public
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autocall-network

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://autocall:autocall@postgres:5432/autocall?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 604800
      COOKIE_SECURE: 'false'
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - autocall-network

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        API_INTERNAL_URL: http://backend:3001
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:3001
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - autocall-network

volumes:
  postgres_data:
  redis_data:

networks:
  autocall-network:
    driver: bridge
